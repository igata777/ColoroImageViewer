<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Boxプロファイル指定</title>
  <desc id="desc">矩形範囲を指定し、水平方向と垂直方向の平均プロファイルを表示する模式図</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b5b7a"/>
    </marker>
    <style>
      .label { font: 18px sans-serif; fill: #25313b; }
      .small { font: 14px sans-serif; fill: #425466; }
      .tiny { font: 12px sans-serif; fill: #5f6f7d; }
      .boxline { stroke: #e5d400; stroke-width: 5; fill: rgba(255, 234, 0, 0.08); }
      .guide { stroke: #f06b2f; stroke-width: 2; stroke-dasharray: 6 4; }
      .flow { stroke: #3b5b7a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="920" height="360" fill="#ffffff"/>
  <text x="36" y="38" class="label">Box プロファイル</text>
  <text x="36" y="63" class="small">矩形範囲を指定し、列方向・行方向に平均化したプロファイルを確認します。</text>

  <rect x="50" y="92" width="350" height="220" fill="#f5f6f7" stroke="#778899" stroke-width="2"/>
  <rect x="75" y="122" width="300" height="160" fill="#e2ddcf" stroke="#cabf9f"/>
  <path d="M80 255 C120 210, 165 225, 198 165 C235 100, 283 142, 360 128" stroke="#ba8f6f" stroke-width="18" fill="none" opacity="0.35"/>
  <rect x="125" y="145" width="205" height="120" class="boxline"/>
  <line x1="170" y1="145" x2="170" y2="265" class="guide"/>
  <line x1="292" y1="145" x2="292" y2="265" class="guide"/>
  <line x1="125" y1="175" x2="330" y2="175" class="guide"/>
  <line x1="125" y1="235" x2="330" y2="235" class="guide"/>
  <circle cx="125" cy="145" r="8" fill="#d92828"/>
  <circle cx="330" cy="265" r="8" fill="#64b044"/>
  <text x="98" y="137" class="small">始点</text>
  <text x="336" y="280" class="small">終点</text>

  <path d="M 420 170 C 470 170, 485 135, 530 135" class="flow"/>
  <path d="M 420 238 C 470 238, 485 270, 530 270" class="flow"/>

  <rect x="550" y="92" width="300" height="90" fill="#fbfbfb" stroke="#778899" stroke-width="2"/>
  <path d="M575 155 C610 122, 650 160, 690 126 C735 92, 780 138, 825 110" stroke="#222" stroke-width="2" fill="none"/>
  <text x="570" y="205" class="small">水平プロファイル</text>

  <rect x="550" y="220" width="300" height="90" fill="#fbfbfb" stroke="#778899" stroke-width="2"/>
  <path d="M575 290 C625 250, 665 270, 710 235 C752 205, 790 278, 825 244" stroke="#222" stroke-width="2" fill="none"/>
  <text x="570" y="333" class="small">垂直プロファイル</text>
  <text x="545" y="75" class="tiny">プロファイルビューで2点範囲を指定すると、画像上にも対応する2本のガイド線が表示されます。</text>
</svg>
